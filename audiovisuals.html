<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Audiovisuals — Wavi's Mindchive
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="pagina">

        <p class="pequeno">
            wavi's mindchive
        </p>

        <p class="decoracion">
            ♡
        </p>

        <h1>
            audiovisuals
        </h1>

        <p class="frase">
            nuestro pequeño archivo audiovisual
        </p>


        <div class="audiovisual-menu">


            <!-- CURRENTLY WATCHING -->

            <a
                href="currently-watching.html"
                class="audiovisual-card"
            >

                <div class="audiovisual-icon">
                    ♡
                </div>

                <div class="audiovisual-info">

                    <h2>
                        currently watching
                    </h2>

                    <p>
                        series y películas que estamos
                        viendo juntas
                    </p>

                </div>

                <span class="audiovisual-arrow">
                    →
                </span>

            </a>


            <!-- RECOMMENDATIONS -->

            <a
                href="recommendations.html"
                class="audiovisual-card"
            >

                <div class="audiovisual-icon">
                    ✦
                </div>

                <div class="audiovisual-info">

                    <h2>
                        recommendations
                    </h2>

                    <p>
                        cosas que queremos recomendarnos
                        o ver juntas
                    </p>

                </div>

                <span class="audiovisual-arrow">
                    →
                </span>

            </a>


        </div>


        <a
            class="volver"
            href="index.html"
        >
            ← volver al inicio
        </a>
